[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ac-rennes-mail-extract"
version = "1.0.0"
description = "Extract an Academie de Rennes mailbox archive into a per-year tree of .eml files plus a CSV index."
requires-python = ">=3.13"
dependencies = []  # standard library only

[project.scripts]
mail-extract = "main:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main", "progress_bar"]

[project.optional-dependencies]
lint = [
  "mypy >= 2.3.1",
  "pipdeptree",
  "pre-commit",
  "ruff ~= 0.16.6",
  "validate-pyproject",
]

build_exe = [
  "pyinstaller ~= 6.22.2",
]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
mypy_path = "src:."
explicit_package_bases = true
namespace_packages = true
check_untyped_defs = true
disable_error_code = [
  "import-untyped",
  "no-redef",
]
