[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ac-rennes-mail-extract"
version = "1.1.0"
description = "Traitement des archives de boites à lettres de l'Académie de Rennes, pour archivage (extraction des fichiers au format EML, groupés par année avec la hiérarchie d'origine des messages, et production de fichiers d'index pour faciliter les recherches).",
requires-python = ">=3.13"
dependencies = [
  "packaging ~= 26.3",
  "XlsxWriter ~= 3.2",
]

[project.scripts]
mail-extract = "main:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main", "progress_bar"]

[project.optional-dependencies]
lint = [
  "mypy ~= 2.3.1",
  "pipdeptree",
  "pre-commit",
  "ruff ~= 0.16.6",
  "validate-pyproject",
]

build_exe = [
  "pyinstaller ~= 6.22.2",
]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
mypy_path = "src:."
explicit_package_bases = true
namespace_packages = true
check_untyped_defs = true
disable_error_code = [
  "import-untyped",
  "no-redef",
]
